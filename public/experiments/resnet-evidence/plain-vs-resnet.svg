<circle cx="400" cy="106.4" r="6" fill="#2563eb"/>
<text x="412" y="78.7" font-size="12" fill="#94a3b8" font-weight="600">28.54% <tspan font-weight="400" font-size="11">plain</tspan></text>
<text x="412" y="118.4" font-size="12" fill="#2563eb" font-weight="600">25.03% <tspan font-weight="400" font-size="11">with shortcuts</tspan></text>
<text x="148" y="79.1" text-anchor="end" font-size="12" fill="#94a3b8" font-weight="600">27.94%</text>
<text x="148" y="101.5" text-anchor="end" font-size="12" fill="#2563eb" font-weight="600">27.88%</text>
<text x="24" y="180.0" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 24 180.0)">top-1 error (lower is better)</text>
<text x="280.0" y="350" text-anchor="middle" font-size="11" fill="#64748b">ImageNet validation images. Without shortcuts, depth made error worse; with them, better.</text>
