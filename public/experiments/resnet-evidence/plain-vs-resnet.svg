<text x="82" y="257.3" text-anchor="end" font-size="11" fill="#64748b">5%</text>
<line x1="90" y1="216.7" x2="470" y2="216.7" stroke="#f1f5f9"/>
<text x="82" y="220.7" text-anchor="end" font-size="11" fill="#64748b">10%</text>
<line x1="90" y1="180.0" x2="470" y2="180.0" stroke="#f1f5f9"/>
<text x="82" y="184.0" text-anchor="end" font-size="11" fill="#64748b">15%</text>
<line x1="90" y1="143.3" x2="470" y2="143.3" stroke="#f1f5f9"/>
<text x="82" y="147.3" text-anchor="end" font-size="11" fill="#64748b">20%</text>
<line x1="90" y1="106.7" x2="470" y2="106.7" stroke="#f1f5f9"/>
<text x="82" y="110.7" text-anchor="end" font-size="11" fill="#64748b">25%</text>
<line x1="90" y1="70.0" x2="470" y2="70.0" stroke="#f1f5f9"/>
<text x="82" y="74.0" text-anchor="end" font-size="11" fill="#64748b">30%</text>
<line x1="90" y1="290" x2="470" y2="290" stroke="#64748b"/>
<text x="160" y="308" text-anchor="middle" font-size="12" fill="#334155">18 layers</text>
<text x="400" y="308" text-anchor="middle" font-size="12" fill="#334155">34 layers</text>
<line x1="160" y1="85.1" x2="400" y2="80.7" stroke="#94a3b8" stroke-width="3"/>
<circle cx="160" cy="85.1" r="6" fill="#94a3b8"/>
<circle cx="400" cy="80.7" r="6" fill="#94a3b8"/>
<line x1="160" y1="85.5" x2="400" y2="106.4" stroke="#2563eb" stroke-width="3"/>
