<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="560" height="380" rx="10" fill="#ffffff"/>
<text x="280.0" y="34" text-anchor="middle" font-size="15" fill="#334155" font-weight="600">Going from 18 to 34 layers, with and without shortcuts</text>
<line x1="90" y1="290.0" x2="470" y2="290.0" stroke="#f1f5f9"/>
<text x="82" y="294.0" text-anchor="end" font-size="11" fill="#64748b">24%</text>
<line x1="90" y1="246.0" x2="470" y2="246.0" stroke="#f1f5f9"/>
<text x="82" y="250.0" text-anchor="end" font-size="11" fill="#64748b">25%</text>
<line x1="90" y1="202.0" x2="470" y2="202.0" stroke="#f1f5f9"/>
<text x="82" y="206.0" text-anchor="end" font-size="11" fill="#64748b">26%</text>
<line x1="90" y1="158.0" x2="470" y2="158.0" stroke="#f1f5f9"/>
<text x="82" y="162.0" text-anchor="end" font-size="11" fill="#64748b">27%</text>
<line x1="90" y1="114.0" x2="470" y2="114.0" stroke="#f1f5f9"/>
<text x="82" y="118.0" text-anchor="end" font-size="11" fill="#64748b">28%</text>
<line x1="90" y1="70.0" x2="470" y2="70.0" stroke="#f1f5f9"/>
<text x="82" y="74.0" text-anchor="end" font-size="11" fill="#64748b">29%</text>
<line x1="90" y1="290" x2="470" y2="290" stroke="#64748b"/>
<text x="160" y="308" text-anchor="middle" font-size="12" fill="#334155">18 layers</text>
<text x="400" y="308" text-anchor="middle" font-size="12" fill="#334155">34 layers</text>
<line x1="160" y1="116.6" x2="400" y2="90.2" stroke="#94a3b8" stroke-width="3"/>
<circle cx="160" cy="116.6" r="6" fill="#94a3b8"/>
<circle cx="400" cy="90.2" r="6" fill="#94a3b8"/>
<text x="412" y="94.2" font-size="12" fill="#94a3b8" font-weight="600">28.54%</text>
<text x="412" y="109.2" font-size="11" fill="#94a3b8">plain</text>
<line x1="160" y1="119.3" x2="400" y2="244.7" stroke="#2563eb" stroke-width="3"/>
<circle cx="160" cy="119.3" r="6" fill="#2563eb"/>
<circle cx="400" cy="244.7" r="6" fill="#2563eb"/>
<text x="412" y="248.7" font-size="12" fill="#2563eb" font-weight="600">25.03%</text>
<text x="412" y="263.7" font-size="11" fill="#2563eb">with shortcuts</text>
<text x="148" y="112.6" text-anchor="end" font-size="12" fill="#94a3b8" font-weight="600">27.94%</text>
<text x="148" y="132.3" text-anchor="end" font-size="12" fill="#2563eb" font-weight="600">27.88%</text>
<text x="24" y="180.0" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 24 180.0)">top-1 error (lower is better)</text>
<text x="280.0" y="350" text-anchor="middle" font-size="11" fill="#64748b">ImageNet validation images. Without shortcuts, depth made error worse; with them, better.</text>
<text x="280.0" y="366" text-anchor="middle" font-size="11" fill="#64748b">The axis starts at 24% so the differences are visible.</text>
</svg>