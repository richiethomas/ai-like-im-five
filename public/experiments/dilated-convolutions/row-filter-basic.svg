<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="640" height="316" rx="10" fill="#ffffff"/>
<text x="320.0" y="34" text-anchor="middle" font-size="15" fill="#334155" font-weight="600">A 3-weight filter on one row of numbers</text>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="94.0" y="97" text-anchor="end" font-size="12" fill="#64748b">row</text>
<rect x="106.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="128.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">2</text>
<rect x="154.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="176.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">7</text>
<rect x="202.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="224.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">1</text>
<rect x="250.0" y="70" width="44" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="272.0" y="96" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">8</text>
<rect x="298.0" y="70" width="44" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="96" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">2</text>
<text x="320.0" y="62" text-anchor="middle" font-size="10.5" fill="#64748b">middle value</text>
<rect x="346.0" y="70" width="44" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="368.0" y="96" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">8</text>
<rect x="394.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="416.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">1</text>
<rect x="442.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="464.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">8</text>
<rect x="490.0" y="70" width="44" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="512.0" y="96" text-anchor="middle" font-size="15" fill="#64748b" font-weight="400">2</text>
<text x="94.0" y="177" text-anchor="end" font-size="12" fill="#64748b">filter</text>
<line x1="272.0" y1="112" x2="272.0" y2="146" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
<rect x="250.0" y="150" width="44" height="40" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="272.0" y="176" text-anchor="middle" font-size="14" fill="#334155">× 1</text>
<line x1="320.0" y1="112" x2="320.0" y2="146" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
<rect x="298.0" y="150" width="44" height="40" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="320.0" y="176" text-anchor="middle" font-size="14" fill="#334155">× 1</text>
<line x1="368.0" y1="112" x2="368.0" y2="146" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
<rect x="346.0" y="150" width="44" height="40" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="368.0" y="176" text-anchor="middle" font-size="14" fill="#334155">× 1</text>
<text x="402.0" y="168" font-size="11" fill="#64748b">3 weights,</text>
<text x="402.0" y="182" font-size="11" fill="#64748b">all set to 1</text>
<text x="320.0" y="240" text-anchor="middle" font-size="16" fill="#334155" font-weight="600" xml:space="preserve"><tspan fill="#2563eb">8</tspan> × 1 + <tspan fill="#2563eb">2</tspan> × 1 + <tspan fill="#2563eb">8</tspan> × 1 = 18</text>
<text x="320.0" y="264" text-anchor="middle" font-size="11.5" fill="#64748b">the output for the middle position</text>
<text x="320.0" y="300" text-anchor="middle" font-size="11" fill="#64748b">A regular convolution reads the middle value and its two neighbors, multiplies each by its weight, and adds them up.</text>
</svg>