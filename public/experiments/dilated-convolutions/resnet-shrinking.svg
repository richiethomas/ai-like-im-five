<line x1="688.5714285714286" y1="100" x2="688.5714285714286" y2="250" stroke="#cbd5e1"/>
<line x1="560" y1="228.57142857142856" x2="710" y2="228.57142857142856" stroke="#cbd5e1"/>
<rect x="624.2857142857142" y="185.71428571428572" width="21.428571428571427" height="21.428571428571427" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="635.0" y="88" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">the 7 × 7 map laid over the image</text>
<text x="635.0" y="270" text-anchor="middle" font-size="11.5" fill="#c2410c">1 position = a 32 × 32 block of pixels</text>
<text x="370.0" y="324" text-anchor="middle" font-size="11" fill="#64748b">Drawn to scale. Each step halves the width and height. By 7 × 7, one position has to stand for a 32 × 32 block,</text>
<text x="370.0" y="340" text-anchor="middle" font-size="11" fill="#64748b">so it cannot say where inside that block an edge between two objects falls.</text>
</svg>