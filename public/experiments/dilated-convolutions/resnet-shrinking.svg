<text x="370.0" y="34" text-anchor="middle" font-size="15" fill="#334155" font-weight="600">How a classification network shrinks the image (ResNet)</text>
<rect x="24" y="100.0" width="150.0" height="150.0" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="99.0" y="268" text-anchor="middle" font-size="12" fill="#334155">224 × 224</text>
<text x="184.0" y="244" text-anchor="middle" font-size="12" fill="#64748b">→</text>
<rect x="194.0" y="175.0" width="75.0" height="75.0" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="231.5" y="268" text-anchor="middle" font-size="12" fill="#334155">112 × 112</text>
<text x="279.0" y="244" text-anchor="middle" font-size="12" fill="#64748b">→</text>
<rect x="289.0" y="212.5" width="37.5" height="37.5" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="307.75" y="268" text-anchor="middle" font-size="12" fill="#334155">56 × 56</text>
<text x="351.0" y="244" text-anchor="middle" font-size="12" fill="#64748b">→</text>
<rect x="361.0" y="231.25" width="18.75" height="18.75" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="370.375" y="268" text-anchor="middle" font-size="12" fill="#334155">28 × 28</text>
<text x="423.0" y="244" text-anchor="middle" font-size="12" fill="#64748b">→</text>
<rect x="433.0" y="240.625" width="9.375" height="9.375" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="437.6875" y="268" text-anchor="middle" font-size="12" fill="#334155">14 × 14</text>
<text x="495.0" y="244" text-anchor="middle" font-size="12" fill="#64748b">→</text>
<rect x="505.0" y="245.3125" width="4.6875" height="4.6875" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
<text x="507.34375" y="268" text-anchor="middle" font-size="12" fill="#334155">7 × 7</text>
