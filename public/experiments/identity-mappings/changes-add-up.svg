<text x="320.0" y="192" text-anchor="middle" font-size="17" font-weight="700" xml:space="preserve"><tspan fill="#334155">5.4</tspan><tspan fill="#334155"> = </tspan><tspan fill="#2563eb">5.0</tspan><tspan fill="#15803d"> + 0.2</tspan><tspan fill="#c2410c"> − 0.1</tspan><tspan fill="#15803d"> + 0.3</tspan></text>
<text x="320.0" y="220" text-anchor="middle" font-size="11" fill="#64748b">The end value is the starting value, still intact, plus each block's change.</text>
