<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 620 354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="620" height="354" rx="10" fill="#ffffff"/>
<text x="310.0" y="34" text-anchor="middle" font-size="15" fill="#334155" font-weight="600">Where the last ReLU sits, before and after</text>
<defs><marker id="a334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<defs><marker id="ac2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="30" y="70" font-size="13" fill="#334155" font-weight="600">Original ResNet</text>
<rect x="40" y="84" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="100.0" y="106" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 1</text>
<text x="100.0" y="125" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<line x1="160" y1="113.0" x2="176.0" y2="113.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a334155)" />
<rect x="178.0" y="100.0" width="44" height="26" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="200.0" y="117.5" text-anchor="middle" font-size="11.5" fill="#c2410c" font-weight="600">ReLU</text>
<line x1="222.0" y1="113.0" x2="238" y2="113.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a334155)" />
<rect x="240" y="84" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="300.0" y="106" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 2</text>
<text x="300.0" y="125" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<line x1="360" y1="113.0" x2="376.0" y2="113.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a334155)" />
<rect x="378.0" y="100.0" width="44" height="26" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="400.0" y="117.5" text-anchor="middle" font-size="11.5" fill="#c2410c" font-weight="600">ReLU</text>
<line x1="422.0" y1="113.0" x2="438" y2="113.0" stroke="#334155" stroke-width="1.6" marker-end="url(#a334155)" />
<rect x="440" y="84" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="500.0" y="106" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 3</text>
<text x="500.0" y="125" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<text x="200.0" y="162" text-anchor="middle" font-size="11" fill="#c2410c">on the path between blocks</text>
<text x="30" y="198" font-size="13" fill="#334155" font-weight="600">Pre-activation</text>
<rect x="40" y="212" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="100.0" y="234" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 1</text>
<text x="100.0" y="253" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<line x1="160" y1="241.0" x2="238" y2="241.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)" />
<rect x="240" y="212" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="300.0" y="234" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 2</text>
<text x="300.0" y="253" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<line x1="360" y1="241.0" x2="438" y2="241.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)" />
<rect x="440" y="212" width="120" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="500.0" y="234" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="600">block 3</text>
<text x="500.0" y="253" text-anchor="middle" font-size="10.5" fill="#64748b">layers + shortcut</text>
<text x="200.0" y="290" text-anchor="middle" font-size="11" fill="#2563eb">nothing in between</text>
<text x="310.0" y="322" text-anchor="middle" font-size="11" fill="#64748b">The ReLU is still in the network. It moves inside each block, before the weight layers,</text>
<text x="310.0" y="338" text-anchor="middle" font-size="11" fill="#64748b">so what one block hands on is exactly what the next block receives.</text>
</svg>