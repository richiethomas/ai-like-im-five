  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#334155" font-weight="normal">multiply each input by a weight, add them up,</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#334155" font-weight="normal">add a bias, then apply an activation (like ReLU)</text>
